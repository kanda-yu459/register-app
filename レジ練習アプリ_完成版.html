<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>レジ練習アプリ 完成版</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;background:#f3f4f6;padding:12px}
.wrap{max-width:900px;margin:auto}
.panel{background:white;border-radius:16px;padding:12px;margin-bottom:10px}
.disp{font-size:42px;font-weight:bold;text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font-size:28px;padding:18px;border-radius:12px;border:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.action{width:100%;margin:6px 0;font-size:22px}
input{width:100%;padding:10px;font-size:20px}
.small{font-size:14px}
</style>
</head>
<body>
<div class="wrap">

<div class="panel">
<div>商品合計</div>
<div id="total" class="disp">0円</div>
</div>

<div class="panel">
<div>入力中</div>
<div id="entry" class="disp">0</div>
</div>

<div class="grid">
<button onclick="num('7')">7</button><button onclick="num('8')">8</button><button onclick="num('9')">9</button>
<button onclick="num('4')">4</button><button onclick="num('5')">5</button><button onclick="num('6')">6</button>
<button onclick="num('1')">1</button><button onclick="num('2')">2</button><button onclick="num('3')">3</button>
<button onclick="num('0')">0</button><button onclick="num('00')">00</button><button onclick="back()">←</button>
</div>

<button class="action" onclick="scanItem()">🔴 スキャンしたふり（ピッ！）</button>
<button class="action" onclick="addMoney()">💴 お預かり金額に追加</button>
<button class="action" onclick="playChime()">🎵 ファミマ入店音</button>
<button class="action" onclick="checkout()">🧾 会計</button>
<button class="action" onclick="resetAll()">♻️ リセット</button>

<div class="panel">
<div>お預かり</div>
<div id="paid" class="disp">0円</div>
</div>

<div class="panel">
<div>おつり</div>
<div id="change" class="disp">0円</div>
</div>

<div class="panel">
<h3>商品登録（保存されます）</h3>
<input id="pname" placeholder="商品名">
<input id="pprice" type="number" placeholder="価格">
<button onclick="addProduct()">商品追加</button>
<div id="plist" class="small"></div>
</div>

</div>

function save(){
 localStorage.total=total;
 localStorage.paid=paid;
 localStorage.products=JSON.stringify(products);
 render();
}

function render(){
 totalEl.textContent=total+"円";
 paidEl.textContent=paid+"円";
 plist.innerHTML=products.map((p,i)=>`<button onclick="useProduct(${i})">${p.name} (${p.price}円)</button>`).join(" ");
}

function num(v){
 entry.textContent=entry.textContent==="0"?v:entry.textContent+v;
}
function back(){entry.textContent=entry.textContent.slice(0,-1)||"0";}
function val(){return Number(entry.textContent||0);}

function beep(){
 const c=new(window.AudioContext||window.webkitAudioContext)();
 const o=c.createOscillator();
 const g=c.createGain();
 o.connect(g); g.connect(c.destination);
 o.frequency.value=2400;
 g.gain.value=.2;
 o.start(); o.stop(c.currentTime+.08);
}

function scanItem(){
 beep();
 total+=val();
 entry.textContent="0";
 save();
}

function addMoney(){
 paid+=val();
 entry.textContent="0";
 save();
}

function playChime(){
 famima.currentTime=0;
 famima.play();
}

function checkout(){
 let ch=paid-total;
 change.textContent=ch+"円";
 alert(`合計 ${total}円\nお預かり ${paid}円\nおつり ${ch}円`);
}

function resetAll(){
 total=0; paid=0; entry.textContent="0"; change.textContent="0円"; save();
}

function addProduct(){
 const n=pname.value.trim();
 const p=Number(pprice.value);
 if(!n||!p) return;
 products.push({name:n,price:p});
 pname.value=''; pprice.value='';
 save();
}

function useProduct(i){
 beep();
 total+=products[i].price;
 save();
}

const totalEl=document.getElementById('total');
const paidEl=document.getElementById('paid');
const entry=document.getElementById('entry');
const change=document.getElementById('change');
const plist=document.getElementById('plist');

render();
</script>
